# =============================================================================
# AnonReq — Docker Compose orchestration
# =============================================================================
# Services on an isolated internal bridge network:
#   1. valkey          — ephemeral cache (persistence disabled)
#   2. presidio-analyzer — PII detection engine
#   3. anonreq         — anonymization gateway (build from Dockerfile)
#
# Observability profile services:
#   4. postgres        — PostgreSQL database for audit logs
#   5. postgres-exporter — Prometheus metric exporter for PostgreSQL
#   6. minio           — MinIO object storage for compliance archives
#   7. prometheus      — Metrics collection and alerting engine
#   8. grafana         — Visualization dashboards
#   9. valkey-exporter — Prometheus metric exporter for Valkey
#
# Production deployments should terminate TLS at a reverse proxy
# (e.g., nginx, Caddy, Cloudflare Tunnel) upstream of the gateway.
# The gateway itself does not handle TLS termination.
# =============================================================================

services:

  # -------------------------------------------------------------------------
  # Valkey — ephemeral key-value store (Redis-compatible)
  # -------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.0
    container_name: anonreq-valkey
    command:
      - valkey-server
      - --save ""
      - --appendonly no
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - anonreq-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Presidio Analyzer — PII / PHI detection (English + German)
  # -------------------------------------------------------------------------
  # Image: built from docker/presidio/Dockerfile, tagged
  # anonreq/presidio-analyzer:2.2.354-de.
  # Base pin remains mcr.microsoft.com/presidio-analyzer:2.2.354.
  # The build pins en_core_web_lg==3.7.1 and de_core_news_lg==3.7.0,
  # loads recognizers for language "de", and runs as uid 10001.
  # See docker/presidio/Dockerfile. DevOps: local build, not a registry pull.
  # Budget ~4 GB RAM. Publish the tag before dropping `build`.
  # The Germany overlay (docker-compose.germany.yml) inherits this service.
  presidio-analyzer:
    build:
      context: ./docker/presidio
      dockerfile: Dockerfile
    image: anonreq/presidio-analyzer:2.2.354-de
    container_name: anonreq-presidio
    healthcheck:
      # POST /analyze language=de and require a PERSON span. GET /health
      # stays green on the stock English-only image.
      test: ["CMD", "python", "/usr/bin/presidio-analyzer/healthcheck.py"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 120s
    networks:
      - anonreq-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # AnonReq Gateway — anonymization proxy
  # -------------------------------------------------------------------------
  anonreq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonreq-gateway
    # Run as the non-root anonreq user (uid 1001, created in Dockerfile).
    # Never run as root: the image already chowns /app at build time, so
    # no runtime privilege drop is needed.
    user: "1001:1001"
    command:
      - uvicorn
      - anonreq.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --no-server-header
    ports:
      - "8080:8080"
    environment:
      # Gateway client credential. Never reuse this as an upstream model key.
      ANONREQ_API_KEY: ${ANONREQ_API_KEY:?err}
      # Optional at compose render time so an overlay can supply this after
      # interpolation. `:?` is evaluated before overlays and blocks
      # `docker compose config` when only XAI_API_KEY is set. Startup still
      # requires a real upstream key. Never reuse ANONREQ_API_KEY.
      PROVIDER_API_KEY: "${PROVIDER_API_KEY:-}"
      # ANONREQ_OPENAI_API_KEY wins over PROVIDER_API_KEY when both are set.
      ANONREQ_OPENAI_API_KEY: "${ANONREQ_OPENAI_API_KEY:-${PROVIDER_API_KEY}}"
      # Optional at compose render time (`:-`, not `:?`). `:?` is evaluated
      # before overlays, which blocks an xAI-only demo that does not set
      # these. Startup still requires them while smart / gemini-pro are configured.
      ANONREQ_ANTHROPIC_API_KEY: "${ANONREQ_ANTHROPIC_API_KEY:-}"
      ANONREQ_GEMINI_API_KEY: "${ANONREQ_GEMINI_API_KEY:-}"
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://api.openai.com}
      ANONREQ_VALKEY_URL: redis://valkey:6379/0
      ANONREQ_PRESIDIO_URL: http://presidio-analyzer:3000
      # Demo image loads en and de. Locales outside this list use English.
      # Startup refuses to boot if a listed language is missing from the analyzer.
      ANONREQ_PRESIDIO_LANGUAGES: ${ANONREQ_PRESIDIO_LANGUAGES:-en,de}
      ANONREQ_POLICY_CONFIG_PATH: config/enterprise-policy.yaml
      ANONREQ_ACTIVE_PRESETS: ${ANONREQ_ACTIVE_PRESETS:-}
      ANONREQ_DATABASE_URL: ${ANONREQ_DATABASE_URL:-sqlite+aiosqlite:////app/data/anonreq.db}
      ANONREQ_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      ANONREQ_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      ANONREQ_ADMIN_API_KEY: ${ANONREQ_ADMIN_API_KEY:-}
      ANONREQ_KMS_BACKEND: ${ANONREQ_KMS_BACKEND:-local}
      ANONREQ_KMS_MASTER_KEY: ${ANONREQ_KMS_MASTER_KEY:-}
      MINIO_SECURE: "false"
      ANONREQ_BREACH_WEBHOOK_URL: ${ANONREQ_BREACH_WEBHOOK_URL:-}
      ANONREQ_ANCHOR_SIGNING_KEY: ${ANONREQ_ANCHOR_SIGNING_KEY:-}
      ANONREQ_LOG_LEVEL: ${ANONREQ_LOG_LEVEL:-INFO}
      ANONREQ_BLOCK_DETAIL_LEVEL: ${ANONREQ_BLOCK_DETAIL_LEVEL:-summary}
      ANONREQ_ENV: ${ANONREQ_ENV:-development}
      ANONREQ_SINGLE_TENANT: ${ANONREQ_SINGLE_TENANT:-false}
      ANONREQ_METRICS_NO_AUTH: ${ANONREQ_METRICS_NO_AUTH:-false}
      ANONREQ_HOST: 0.0.0.0
      ANONREQ_PORT: "8080"
      ANONREQ_CA_DIR: /app/data/ca
    volumes:
      - anonreq_data:/app/data
    depends_on:
      valkey:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; req = urllib.request.Request('http://localhost:8080/health', headers={'Authorization': 'Bearer ' + os.environ['ANONREQ_API_KEY']}); urllib.request.urlopen(req, timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - anonreq-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # PostgreSQL — Audit log database (Observability Profile)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: anonreq-postgres
    environment:
      # WARNING: never use default credentials in production. In
      # production mode (ANONREQ_ENV=production) the gateway refuses to
      # boot when POSTGRES_PASSWORD / MINIO_ROOT_* are unset or default.
      POSTGRES_USER: ${POSTGRES_USER:-anonreq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-anonreq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anonreq} -d ${POSTGRES_DB:-anonreq}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anonreq-net
    profiles: [ "observability" ]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Postgres Exporter — Metrics (Observability Profile)
  # -------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: anonreq-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-anonreq}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-anonreq}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anonreq-net
    profiles: [ "observability" ]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # MinIO — Compliance Archive Object Storage (Observability Profile)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: anonreq-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anonreq-net
    profiles: [ "observability" ]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Prometheus — Metrics Collection Engine (Observability Profile)
  # -------------------------------------------------------------------------
  prometheus:
    image: anonreq/prometheus:local
    container_name: anonreq-prometheus
    build:
      context: ./docker/prometheus
      dockerfile: Dockerfile
    volumes:
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      anonreq:
        condition: service_started
    networks:
      - anonreq-net
    ports:
      - "9090:9090"
    profiles: [ "observability" ]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Grafana — Visualization Dashboards (Observability Profile)
  # -------------------------------------------------------------------------
  grafana:
    image: anonreq/grafana:local
    container_name: anonreq-grafana
    build:
      context: ./docker/grafana
      dockerfile: Dockerfile
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/slo_dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - anonreq-net
    ports:
      - "3000:3000"
    profiles: [ "observability" ]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Valkey Exporter — Metrics (Observability Profile)
  # -------------------------------------------------------------------------
  valkey-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: anonreq-valkey-exporter
    environment:
      REDIS_ADDR: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_started
    networks:
      - anonreq-net
    profiles: [ "observability" ]
    restart: unless-stopped

networks:
  anonreq-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  anonreq_data:
