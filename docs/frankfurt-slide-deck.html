            ${s.badge}
          </div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-[var(--foreground)]">
            ${s.title}
          </h1>
          <p class="text-sm md:text-base text-[var(--muted-foreground)] mt-1.5">
            ${s.subtitle}
          </p>
          ${s.body}
        </div>
        <div class="mt-6 pt-3 border-t border-[var(--border)] flex items-center justify-between text-xs text-[var(--muted-foreground)]">
          <span>AnonReq · Privacy-First AI Gateway · Abdullah Al-Jauni (InfraTechton)</span>
          <span>Use ← / → arrow keys to navigate</span>
        </div>
      `;

      const dots = document.getElementById("dotsContainer");
      dots.innerHTML = slides.map((_, idx) => `
        <button onclick="goToSlide(${idx})" class="h-2 rounded-full transition-all ${idx === currentSlide ? 'w-6 bg-[var(--primary)]' : 'w-2 bg-[var(--border)]'}" aria-label="Go to slide ${idx + 1}"></button>
      `).join("");
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % slides.length;
      renderSlide();
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + slides.length) % slides.length;
      renderSlide();
    }

    function goToSlide(idx) {
      currentSlide = idx;
      renderSlide();
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const box = document.getElementById("notesBox");
      const btn = document.getElementById("toggleNotesBtn");
      box.style.display = showNotes ? "block" : "none";
      btn.textContent = showNotes ? "Hide Speaker Notes (N)" : "Show Speaker Notes (N)";
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === "n") {
        toggleNotes();
      }
    });

    renderSlide();
  </script>
</body>
</html>
