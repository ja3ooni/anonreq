# Overlay for a one-day German PoC. Do not enable autoscaling until the
# CISO has signed off on the data-flow diagram.
#
#   helm upgrade --install anonreq ./helm/anonreq -f helm/anonreq/values-germany.yaml \
#     --set secrets.ANONREQ_API_KEY="$ANONREQ_API_KEY" \
#     --set secrets.PROVIDER_API_KEY="$PROVIDER_API_KEY" \
#     --set secrets.ANONREQ_ANTHROPIC_API_KEY="$ANONREQ_ANTHROPIC_API_KEY" \
#     --set secrets.ANONREQ_GEMINI_API_KEY="$ANONREQ_GEMINI_API_KEY"
# PROVIDER_API_KEY is the upstream model key, not ANONREQ_API_KEY.
# mock, local, and ollama need no key.
#
# The container image listens on 8080. Point ingress TLS at that Service.
#
# Presidio is not deployed by this chart. The analyzer at ANONREQ_PRESIDIO_URL
# must be the bilingual image built from docker/presidio/Dockerfile
# (en_core_web_lg + de_core_news_lg, languages en and de). The stock
# mcr.microsoft.com/presidio-analyzer:2.2.354 image only loads English.

replicaCount: 1

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  ANONREQ_LOG_LEVEL: "INFO"
  ANONREQ_ENV: "poc"
  ANONREQ_ACTIVE_PRESETS: "germany"
  ANONREQ_HOST: "0.0.0.0"
  ANONREQ_PORT: "8080"
  ANONREQ_VALKEY_URL: "redis://valkey:6379/0"
  ANONREQ_PRESIDIO_URL: "http://presidio-analyzer:3000"
  ANONREQ_PRESIDIO_LANGUAGES: "en,de"

secrets:
  # Gateway client credential. Do not copy this into the provider keys.
  ANONREQ_API_KEY: "change-me-32-chars-minimum-key!!"
  # Upstream keys. The gateway no longer falls back to ANONREQ_API_KEY.
  # Replace every change-me value before sending traffic. mock, local,
  # and ollama do not need a key; remove an alias to drop its key.
  PROVIDER_API_KEY: "change-me-customer-model-key"
  ANONREQ_ANTHROPIC_API_KEY: "change-me-anthropic-key"
  ANONREQ_GEMINI_API_KEY: "change-me-gemini-key"
