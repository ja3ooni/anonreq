# Overlay for a one-day German PoC. Do not enable autoscaling until the
# CISO has signed off on the data-flow diagram.
#
#   helm upgrade --install anonreq ./helm/anonreq -f helm/anonreq/values-germany.yaml \
#     --set secrets.ANONREQ_API_KEY="$ANONREQ_API_KEY" \
#     --set secrets.PROVIDER_API_KEY="$PROVIDER_API_KEY"
#
# The container image listens on 8080. Point ingress TLS at that Service.

replicaCount: 1

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

livenessProbe:
  # exec, not httpGet: /health requires the bearer key, which httpGet cannot send
  # without writing the secret into the manifest. Same check as the Dockerfile.
  exec:
    command:
      - python
      - -c
      - "import os, urllib.request; req = urllib.request.Request('http://localhost:8080/health', headers={'Authorization': 'Bearer ' + os.environ['ANONREQ_API_KEY']}); urllib.request.urlopen(req, timeout=4).read()"
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  # exec, not httpGet: /health requires the bearer key, which httpGet cannot send
  # without writing the secret into the manifest. Same check as the Dockerfile.
  exec:
    command:
      - python
      - -c
      - "import os, urllib.request; req = urllib.request.Request('http://localhost:8080/health/ready', headers={'Authorization': 'Bearer ' + os.environ['ANONREQ_API_KEY']}); urllib.request.urlopen(req, timeout=4).read()"
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  ANONREQ_LOG_LEVEL: "INFO"
  ANONREQ_ENV: "poc"
  ANONREQ_ACTIVE_PRESETS: "germany"
  ANONREQ_HOST: "0.0.0.0"
  ANONREQ_PORT: "8080"
  ANONREQ_VALKEY_URL: "redis://valkey:6379/0"
  ANONREQ_PRESIDIO_URL: "http://presidio-analyzer:3000"

secrets:
  ANONREQ_API_KEY: "change-me-32-chars-minimum-key!!"
  PROVIDER_API_KEY: "change-me-customer-model-key"
