# Default values for anonreq.
replicaCount: 3

image:
  repository: anonreq/gateway
  pullPolicy: IfNotPresent
  tag: "2.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: anonreq.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - anonreq
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []

livenessProbe:
  # exec, not httpGet: /health requires the bearer key, which httpGet cannot send
  # without writing the secret into the manifest. Same check as the Dockerfile.
  exec:
    command:
      - python
      - -c
      - "import os, urllib.request; req = urllib.request.Request('http://localhost:8080/health', headers={'Authorization': 'Bearer ' + os.environ['ANONREQ_API_KEY']}); urllib.request.urlopen(req, timeout=4).read()"
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  # exec, not httpGet: /health requires the bearer key, which httpGet cannot send
  # without writing the secret into the manifest. Same check as the Dockerfile.
  exec:
    command:
      - python
      - -c
      - "import os, urllib.request; req = urllib.request.Request('http://localhost:8080/health/ready', headers={'Authorization': 'Bearer ' + os.environ['ANONREQ_API_KEY']}); urllib.request.urlopen(req, timeout=4).read()"
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

env:
  ANONREQ_LOG_LEVEL: "INFO"
  ANONREQ_ENV: "production"
  ANONREQ_VALKEY_HOST: "valkey-cluster"
  ANONREQ_VALKEY_PORT: "6379"

secrets:
  ANONREQ_AUTH_SECRET_KEY: "change-me-in-production"
