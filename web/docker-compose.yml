# Demo UI. No login.
#
# The process listens on 0.0.0.0 inside the container so this publish
# can reach it. The host side is 127.0.0.1:3000:3000, which is what
# keeps other machines off the app.
# Never change this to 0.0.0.0:3000. That exposes the gateway and admin
# keys. Anyone who can reach the app can export audit logs, see raw PII
# through the preview, and spend provider credits.

services:
  anonreq-web:
    build: .
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      ANONREQ_MOCK: "true"
      ANONREQ_TENANT_ID: default
    ports:
      - "127.0.0.1:3000:3000"
