# Join the PR #20 demo stack (make demo / docker-compose.demo.yml at repo root).
#
#   cd ..; make demo                       # gateway, Presidio, Valkey on anonreq-net
#   cd web; docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Uses the same .env as the root stack: ANONREQ_API_KEY (gateway key, chat)
# and ANONREQ_ADMIN_API_KEY (preview + audit). The gateway must run with
# ANONREQ_DEBUG_PREVIEW_ENABLED=true, which #20 sets. The UI reaches the
# gateway over the compose network by container name; it is still only
# published on 127.0.0.1:3000.
services:
  anonreq-web:
    env_file:
      - path: ../.env
        required: false
    environment:
      ANONREQ_GATEWAY_URL: ${ANONREQ_GATEWAY_URL:-http://anonreq-gateway:8080}
    networks:
      - anonreq-net

networks:
  anonreq-net:
    external: true
    # Root compose project "anonreq" -> network "anonreq_anonreq-net".
    name: ${ANONREQ_COMPOSE_NETWORK:-anonreq_anonreq-net}
