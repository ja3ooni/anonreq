openapi: "3.1.0"
info:
  title: AnonReq Multimodal Document Anonymization API
  description: |
    Self-hosted anonymization gateway for LLM API calls.

    AnonReq intercepts outbound requests, detects and replaces PII with
    placeholder tokens, forwards sanitized payloads to supported LLM
    providers, and restores tokens in responses.

    ## Content-Type Support

    | Content-Type | Analyzer | Status |
    |--------------|----------|--------|
    | `text/plain` | Text Analyser | Supported |
    | `application/json` | JSON Analyzer | Supported |
    | `multipart/form-data` | Multipart Analyzer | Supported |
    | `application/xml` | — | Rejected (415) |
    | `application/octet-stream` | — | Rejected (415) |
    | `image/*`, `audio/*`, `video/*` | — | Rejected (415) |

    All synthetic example data — no real PII in documentation.
  version: "1.0.0"
  contact:
    name: AnonReq Support
    url: https://github.com/anonreq/anonreq
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /v1/chat/completions:
    post:
      summary: Send a chat completion request with automatic PII anonymization
      description: |
        Accepts OpenAI-compatible chat completion requests.  PII is detected,
        tokenized, and replaced inline before forwarding to the configured LLM
        provider.  Responses are restored (tokens → original values) before
        returning to the caller.

        **Supported content types:**
        - `application/json` — standard JSON request body
        - `multipart/form-data` — multipart requests for file uploads
        - `text/plain` — raw text for text-only pipelines

        **Unsupported content types** receive an HTTP 415 response.
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              json_request:
                summary: JSON chat completion with PII
                value:
                  model: gpt-4
                  messages:
                    - role: user
                      content: My email is john.doe@example.com and my SSN is 123-45-6789
                  stream: false
              tool_call_openai:
                summary: OpenAI tool call with PII
                value:
                  model: gpt-4
                  messages:
                    - role: user
                      content: Look up the user
                    - role: assistant
                      content: null
                      tool_calls:
                        - id: call_abc123
                          type: function
                          function:
                            name: lookup_user
                            arguments: >
                              {"email":"alice@example.com","name":"Alice Smith"}
              tool_call_anthropic:
                summary: Anthropic tool use format
                value:
                  model: claude-3-opus
                  messages:
                    - role: user
                      content: Find user details
                    - role: assistant
                      content:
                        - type: text
                          text: I'll look that up
                        - type: tool_use
                          id: tu_001
                          name: find_user
                          input:
                            email: bob@example.com
                            user_id: 42
              tool_call_mcp:
                summary: MCP tool call format
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/call
                  params:
                    name: lookup_user
                    arguments:
                      email: carol@example.com
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MultipartRequest"
            examples:
              multipart_with_pii:
                summary: Multipart form with PII in parts
                value:
                  - name: user
                    content_type: text/plain
                    data: "John Doe, john@example.com"
                  - name: metadata
                    content_type: application/json
                    data: '{"email":"jane@example.com","role":"admin"}'
          text/plain:
            schema:
              type: string
              example: "My phone number is +1-555-123-4567 and email is user@example.com"
      responses:
        "200":
          description: Successful response with restored values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      summary: Prometheus metrics
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
  /v1/debug/anonymize-preview:
    post:
      summary: Preview anonymization without persisting or calling a provider
      description: |
        Admin-only. Disabled unless `ANONREQ_DEBUG_PREVIEW_ENABLED=true`;
        otherwise the route responds **404** before authentication.

        Runs the gateway detection and tokenization stages. Does not call a
        model, write the token cache, or append audit or anonymization events.

        Send `prompt`, OpenAI-style `messages`, or both. Optional `tenant_id`
        (alias `tenant`) selects the tenant context. Optional `policy` is a
        policy rule id evaluated read-only: `BLOCK` returns 403 and
        `ROUTE_LOCAL` returns 501.

        `X-AnonReq-Locale` selects the locale bundle. The JSON `locale` field
        is that negotiated locale (`universal` when the header is absent).
        `classification` is the same value as the `X-AnonReq-Classification`
        response header (`PUBLIC`, `INTERNAL`, `CONFIDENTIAL`, `RESTRICTED`,
        or `HIGHLY_RESTRICTED`). `highest_entity` matches
        `X-AnonReq-Highest-Entity`.

        Entity offsets are 0-based. `start`/`end` and `token_start`/`token_end`
        are Unicode code points. `*_utf16` fields are UTF-16 code units into
        the same string (original text for `start_utf16`/`end_utf16`,
        anonymized text for the token fields). `message_index` is null for
        prompt spans and the source message index for `messages`.
        `anonymized_text` is null when `prompt` was omitted.
        `anonymized_messages` is null when `messages` was omitted.

        Token indexes are a per-request random offset, not a stable counter.
      operationId: anonymizePreview
      security:
        - BearerAuth: []
      x-rbac:
        minimum_role: administrator
      parameters:
        - name: X-AnonReq-Locale
          in: header
          required: false
          schema:
            type: string
          description: Locale bundle code, for example `de-DE`.
        - name: X-AnonReq-Tenant-ID
          in: header
          required: false
          schema:
            type: string
          description: >
            Tenant header required by the gateway's tenant middleware on
            `/v1/*`. The body `tenant_id` overrides the pipeline tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymizePreviewRequest"
            examples:
              prompt:
                summary: Single prompt
                value:
                  prompt: "Contact ada@example.com about the invoice"
                  tenant_id: acme
              messages:
                summary: OpenAI-style messages
                value:
                  messages:
                    - role: user
                      content: "Contact ada@example.com about the invoice"
                  policy: allow-external
      responses:
        "200":
          description: Anonymized preview. Nothing was persisted.
          headers:
            X-AnonReq-Request-ID:
              schema:
                type: string
            X-AnonReq-Classification:
              schema:
                type: string
              description: Same value as `classification`.
            X-AnonReq-Highest-Entity:
              schema:
                type: string
              description: Same value as `highest_entity`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymizePreviewResponse"
              examples:
                messages:
                  summary: Message preview
                  value:
                    request_id: req_0123456789abcdef01234567
                    locale: de-DE
                    classification: CONFIDENTIAL
                    highest_entity: EMAIL_ADDRESS
                    anonymized_text: null
                    anonymized_messages:
                      - role: user
                        content: "Contact [EMAIL_ADDRESS_2847561234] about the invoice"
                        message_index: 0
                    entities:
                      - entity_type: EMAIL_ADDRESS
                        span: ada@example.com
                        token: "[EMAIL_ADDRESS_2847561234]"
                        score: 1.0
                        start: 8
                        end: 23
                        start_utf16: 8
                        end_utf16: 23
                        token_start: 8
                        token_end: 35
                        token_start_utf16: 8
                        token_end_utf16: 35
                        message_index: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Preview disabled, or the named policy does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/anonymization-events:
    get:
      summary: List anonymization events
      description: |
        One row per anonymized request. Metadata only — raw values are never
        returned. `timestamp` is ISO-8601 UTC (`Z` suffix).

        Filters match the CSV export: `date_from`, `date_to`, `entity_type`,
        and `tenant_id`. `sort` is `timestamp:desc` (default) or
        `timestamp:asc`. `limit` defaults to 50 and cannot exceed 200.
      operationId: listAnonymizationEvents
      security:
        - BearerAuth: []
      x-rbac:
        minimum_role: administrator
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/EntityType"
        - $ref: "#/components/parameters/TenantId"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: ["timestamp:desc", "timestamp:asc"]
            default: "timestamp:desc"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Page of anonymization events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymizationEventsResponse"
              examples:
                page:
                  value:
                    total: 2
                    limit: 50
                    offset: 0
                    items:
                      - request_id: req_abc
                        timestamp: "2026-08-14T09:00:00Z"
                        tenant_id: acme
                        model: gpt-4o
                        locale: de-DE
                        decision: ANONYMIZE
                        token_count: 2
                        entity_types:
                          - type: EMAIL_ADDRESS
                            count: 1
                          - type: IBAN_DE
                            count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/anonymization-events/export:
    get:
      summary: Stream anonymization events as CSV
      description: |
        Streams every row matching the same filters as
        `GET /v1/admin/anonymization-events`. There is no 10_000-row cap.
        `limit` and `offset` are not accepted.

        Columns, in order: `request_id`, `timestamp`, `tenant_id`, `model`,
        `locale`, `decision`, `token_count`, `entity_types`. Null JSON fields
        are empty CSV cells. `entity_types` is a JSON array in that cell,
        for example `[{"type":"EMAIL_ADDRESS","count":1}]`.
      operationId: exportAnonymizationEvents
      security:
        - BearerAuth: []
      x-rbac:
        minimum_role: administrator
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/EntityType"
        - $ref: "#/components/parameters/TenantId"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: ["timestamp:desc", "timestamp:asc"]
            default: "timestamp:desc"
      responses:
        "200":
          description: CSV attachment streamed to completion.
          content:
            text/csv:
              schema:
                type: string
              example: |
                request_id,timestamp,tenant_id,model,locale,decision,token_count,entity_types
                req_abc,2026-08-14T09:00:00Z,acme,gpt-4o,de-DE,ANONYMIZE,2,"[{""type"":""EMAIL_ADDRESS"",""count"":1}]"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/policies:
    get:
      summary: List all policies
      description: Returns a list of all configured policy rules for the operator's tenant.
      operationId: listPolicies
      security:
        - BearerAuth: []
      x-rbac:
        minimum_role: operator
      parameters:
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter policies by enabled status
      responses:
        "200":
          description: A list of policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/PolicyRule"
                  total:
                    type: integer
                    example: 3
                  version:
                    type: string
                    example: v1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/policies/{policy_id}:
    put:
      summary: Create or update a policy rule
      description: Upserts a policy rule for the tenant. Replaces existing rule if policy_id matches.
      operationId: updatePolicy
      security:
        - BearerAuth: []
      x-rbac:
        minimum_role: administrator
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
          description: The unique ID of the policy rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRule"
      responses:
        "200":
          description: Policy upserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy:
                    $ref: "#/components/schemas/PolicyRule"
                  version:
                    type: string
                    example: v2
                  updated:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/admin/tenants/{tenant_id}/usage:
    get:
      summary: Retrieve current tenant usage metrics
      description: Returns current counters for rate limits (RPM, TPM, concurrent) and spend budgets (daily/monthly).
      operationId: getTenantUsage
      security:
        - BearerAuth: []
      x-rbac:
        minimum_role: operator
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
          description: The tenant ID to query
      responses:
        "200":
          description: Tenant usage metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    example: test_tenant
                  usage:
                    $ref: "#/components/schemas/UsageRecord"
                  reset_at:
                    type: string
                    format: date-time
                    example: "2026-07-03T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  schemas:
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Model identifier (e.g., gpt-4, claude-3-opus)
          example: gpt-4
        messages:
          type: array
          description: Array of message objects in OpenAI-compatible format
          items:
            $ref: "#/components/schemas/Message"
        stream:
          type: boolean
          description: Enable SSE streaming response
          default: false
          example: false
        temperature:
          type: number
          format: float
          description: Sampling temperature
          default: 1.0
          example: 0.7
        max_tokens:
          type: integer
          description: Maximum tokens in response
          example: 1024
    Message:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          description: Message role
          example: user
        content:
          oneOf:
            - type: string
              description: Text content
              example: My email is user@example.com
            - type: array
              description: Content array (Anthropic format)
              items:
                $ref: "#/components/schemas/ContentBlock"
          nullable: true
        tool_calls:
          type: array
          description: OpenAI tool calls array
          items:
            $ref: "#/components/schemas/ToolCall"
        tool_call_id:
          type: string
          description: Tool call identifier (for tool role)
    ContentBlock:
      type: object
      properties:
        type:
          type: string
          enum: [text, tool_use, tool_result, image]
          description: Content block type
        text:
          type: string
          description: Text content for text-type blocks
        id:
          type: string
          description: Tool use identifier (for tool_use blocks)
        name:
          type: string
          description: Tool name (for tool_use blocks)
        input:
          type: object
          description: Tool input arguments (for tool_use blocks)
    ToolCall:
      type: object
      properties:
        id:
          type: string
          description: Tool call identifier
          example: call_abc123
        type:
          type: string
          enum: [function]
          description: Tool call type
        function:
          type: object
          properties:
            name:
              type: string
              description: Function name
              example: send_email
            arguments:
              type: string
              description: JSON-encoded function arguments
              example: '{"recipient":"alice@example.com","subject":"Hello"}'
    MultipartPart:
      type: object
      properties:
        name:
          type: string
          description: Form field name
          example: document
        content_type:
          type: string
          description: Part content type
          example: text/plain
        data:
          type: string
          description: Part body content
          example: John Doe, john@example.com
        filename:
          type: string
          description: Original filename (for file uploads)
          example: report.pdf
    MultipartRequest:
      type: array
      description: Array of multipart parts
      items:
        $ref: "#/components/schemas/MultipartPart"
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
          example: chatcmpl-abc123
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          example: 1700000000
        model:
          type: string
          example: gpt-4
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
        usage:
          $ref: "#/components/schemas/Usage"
    Choice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/Message"
        finish_reason:
          type: string
          enum: [stop, length, tool_calls, content_filter]
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message
            type:
              type: string
              description: Error type identifier
            code:
              type: string
              description: Machine-readable error code
      required:
        - error
    UnsupportedMediaTypeError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            error:
              properties:
                message:
                  example: "Unsupported Content-Type: application/xml"
                type:
                  example: unsupported_media_type
                code:
                  example: unsupported_media_type
    UnifiedDetectionResult:
      type: object
      description: Result of PII detection analysis
      properties:
        content_type:
          $ref: "#/components/schemas/ContentTypeEnum"
        entities:
          type: array
          description: Detected PII entities (metadata only, no raw values)
          items:
            $ref: "#/components/schemas/DetectedEntity"
        risk_score:
          type: number
          format: float
          description: Aggregate risk score (0.0–1.0)
        classification:
          type: string
          enum: [Internal, Sensitive, Confidential, Highly Restricted]
        analyzer_metadata:
          type: object
          description: Analyzer-specific metadata (entity counts, timings)
    DetectedEntity:
      type: object
      description: A detected PII entity (metadata — no raw value in audit logs)
      properties:
        entity_type:
          type: string
          description: PII entity type (EMAIL_ADDRESS, US_SSN, PHONE_NUMBER, etc.)
        start:
          type: integer
          description: Start offset in source text
        end:
          type: integer
          description: End offset in source text
        score:
          type: number
          format: float
          description: Detection confidence (0.0–1.0)
        json_path:
          type: string
          description: JSON path to the entity in the original payload
        sensitive_key_boosted:
          type: boolean
          description: Whether score was boosted by sensitive key detection
    ContentTypeEnum:
      type: string
      enum:
        - text/plain
        - application/json
        - multipart/form-data
        - unknown
      description: Supported content types for the multimodal pipeline
    PolicyAction:
      type: string
      enum:
        - BLOCK
        - ALLOW
        - ROUTE_LOCAL
        - FLAG_AND_FORWARD
        - MONITOR
    PolicyRule:
      type: object
      required:
        - rule_id
        - action
      additionalProperties: false
      properties:
        rule_id:
          type: string
          example: rule_001
        enabled:
          type: boolean
          default: true
          example: true
        version:
          type: integer
          default: 1
          example: 1
        name:
          type: string
          default: ""
          example: "Block GPT-4 for external users"
        description:
          type: string
          nullable: true
          example: "Strict PII block rule"
        action:
          $ref: "#/components/schemas/PolicyAction"
        priority:
          type: integer
          default: 0
          example: 10
        conditions:
          type: object
          nullable: true
          example: {"model": "gpt-4"}
        metadata:
          type: object
          example: {}
        tenant_id:
          type: string
          nullable: true
          example: test_tenant
    PolicyDecision:
      type: object
      required:
        - action
        - matched_rule_ids
        - decision_ts
      additionalProperties: false
      properties:
        action:
          $ref: "#/components/schemas/PolicyAction"
        matched_rule_ids:
          type: array
          items:
            type: string
          example: ["rule_001"]
        decision_ts:
          type: string
          format: date-time
          example: "2026-07-03T12:00:00Z"
        ttl_seconds:
          type: integer
          default: 60
          example: 60
        reason:
          type: string
          nullable: true
          example: "PII detected"
        enforcement:
          type: string
          nullable: true
          example: "503"
    UsageRecord:
      type: object
      required:
        - tenant_id
        - rpm_current
        - tpm_current
        - concurrent_current
        - daily_spend
        - monthly_spend
        - reset_at
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          example: test_tenant
        rpm_current:
          type: integer
          example: 42
        tpm_current:
          type: integer
          example: 5000
        concurrent_current:
          type: integer
          example: 3
        daily_spend:
          type: number
          example: 12.5
        monthly_spend:
          type: number
          example: 350.0
        reset_at:
          type: string
          format: date-time
          example: "2026-07-03T12:00:00Z"
    AnonymizePreviewRequest:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          nullable: true
          description: Plain text to anonymize. Required if `messages` is omitted.
        messages:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PreviewMessage"
        tenant_id:
          type: string
          nullable: true
        tenant:
          type: string
          nullable: true
          description: Alias of `tenant_id`. `tenant_id` wins when both are set.
        policy:
          type: string
          nullable: true
          description: Policy rule id. Evaluated read-only.
    PreviewMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role:
          type: string
          example: user
        content:
          type: string
    PreviewEntity:
      type: object
      required:
        - entity_type
        - span
        - token
        - score
        - start
        - end
        - start_utf16
        - end_utf16
        - token_start
        - token_end
        - token_start_utf16
        - token_end_utf16
      additionalProperties: false
      properties:
        entity_type:
          type: string
          example: EMAIL_ADDRESS
        span:
          type: string
          description: Original text between `start` and `end`.
          example: ada@example.com
        token:
          type: string
          example: "[EMAIL_ADDRESS_2847561234]"
        score:
          type: number
          format: float
          example: 1.0
        start:
          type: integer
          description: Code-point offset into the original text.
        end:
          type: integer
          description: Code-point end offset into the original text.
        start_utf16:
          type: integer
        end_utf16:
          type: integer
        token_start:
          type: integer
          description: Code-point offset of the token in the anonymized text.
        token_end:
          type: integer
        token_start_utf16:
          type: integer
        token_end_utf16:
          type: integer
        message_index:
          type: integer
          nullable: true
          description: Null for prompt spans. Message index otherwise.
    AnonymizedMessage:
      type: object
      required: [role, content, message_index]
      additionalProperties: false
      properties:
        role:
          type: string
        content:
          type: string
        message_index:
          type: integer
    AnonymizePreviewResponse:
      type: object
      required:
        - request_id
        - locale
        - classification
        - highest_entity
        - entities
      additionalProperties: false
      properties:
        request_id:
          type: string
        locale:
          type: string
          example: de-DE
        classification:
          type: string
          enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED, HIGHLY_RESTRICTED]
        highest_entity:
          type: string
        anonymized_text:
          type: string
          nullable: true
        anonymized_messages:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AnonymizedMessage"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/PreviewEntity"
    EntityTypeCount:
      type: object
      required: [type, count]
      additionalProperties: false
      properties:
        type:
          type: string
          example: EMAIL_ADDRESS
        count:
          type: integer
          example: 1
    AnonymizationEventItem:
      type: object
      required:
        - timestamp
        - tenant_id
        - entity_types
      additionalProperties: false
      properties:
        request_id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 UTC with a Z suffix.
          example: "2026-08-14T09:00:00Z"
        tenant_id:
          type: string
        model:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        decision:
          type: string
          nullable: true
        token_count:
          type: integer
          nullable: true
        entity_types:
          type: array
          items:
            $ref: "#/components/schemas/EntityTypeCount"
    AnonymizationEventsResponse:
      type: object
      required: [total, limit, offset, items]
      additionalProperties: false
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnonymizationEventItem"
  parameters:
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive range start. Same parameter as the anonymization export.
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive range end.
    EntityType:
      name: entity_type
      in: query
      required: false
      schema:
        type: string
      description: Keep rows whose masked entity types include this value.
    TenantId:
      name: tenant_id
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request — invalid payload format
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Unsupported Content-Type header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnsupportedMediaTypeError"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable (payload limit exceeded, upstream down)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized request — missing or invalid admin API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden request — insufficient role permissions or tenant scope violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Unprocessable entity — request body validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

