code: de-DE
metadata:
  name: German
  version: 2
  maintainer: "AnonReq Core"
entity_types:
  - name: TAX_ID_DE
    tier: REGEX
    confidence_threshold: 0.9
    reversible: true
    patterns:
      - '\b[1-9]\d{10}\b'
      - '\b[1-9]\d(?:\s\d{3}){3}\b'
  - name: PERSONAL_AUSWEIS
    tier: REGEX
    confidence_threshold: 0.9
    reversible: true
    patterns:
      - '\b[A-Z](?!\d{9}\b)[A-Z0-9]{8}\d\b'
  - name: KVNR
    tier: REGEX
    confidence_threshold: 0.9
    reversible: true
    patterns:
      - '\b[A-Z]\d{9}\b'
  - name: SVNR_DE
    tier: REGEX
    confidence_threshold: 0.85
    reversible: true
    patterns:
      - '\b\d{2}\s?\d{6}\s?[A-Z]\s?\d{3}\b'
  - name: IBAN_DE
    tier: REGEX
    confidence_threshold: 0.95
    reversible: true
    patterns:
      - '\bDE\d{2}(?:\s?\d{4}){4}\s?\d{2}\b'
  - name: HR_NUMBER
    tier: REGEX
    confidence_threshold: 0.85
    reversible: true
    patterns:
      - '\bHR[AB]\s?\d{1,6}(?:\s[A-Z]{1,3})?\b'
  - name: AKTENZEICHEN
    tier: REGEX
    confidence_threshold: 0.8
    reversible: true
    patterns:
      - '\bAz\.?\s*\d{1,3}\s*[A-ZÄÖÜ]{1,5}\s*\d{1,6}/\d{2,4}\b'
      - '\b\d{1,2}\s*BvR\s*\d{1,5}/\d{2}\b'
  - name: API_KEY
    tier: REGEX
    confidence_threshold: 0.95
    reversible: false
    patterns:
      - '\bsk-[a-zA-Z0-9]{20,}\b'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\bghp_[a-zA-Z0-9]{36}\b'
  # Format-only matches without a valid checksum (or lowercase IBANs).
  # Masked at lower confidence; the checksum-valid types win overlaps.
  - name: IBAN_UNVERIFIED
    tier: REGEX
    confidence_threshold: 0.6
    reversible: true
    patterns:
      - '(?i:(?<![\w-])[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){3,7}(?:\s?[A-Z0-9]{1,3})?(?![\w-]))'
  - name: TAX_ID_DE_UNVERIFIED
    tier: REGEX
    confidence_threshold: 0.6
    reversible: true
    patterns:
      - '(?<![\w.,/-])[1-9]\d{10}(?![\w.,/-])'
      - '(?<![\w.,/-])[1-9]\d(?:\s\d{3}){3}(?![\w.,/-])'
  - name: DATE_OF_BIRTH
    tier: REGEX
    confidence_threshold: 0.9
    reversible: true
    patterns:
      - '(?:(?<=geb\. )|(?<=geb\.)|(?<=geboren am )|(?<=geboren )|(?<=Geburtsdatum: )|(?<=Geburtsdatum )|(?<=DOB: ))\d{1,2}\.\s?\d{1,2}\.\s?(?:19|20)\d{2}\b'
  - name: DATE_DE
    tier: REGEX
    confidence_threshold: 0.8
    reversible: true
    patterns:
      - '(?<![\w.])\d{1,2}\.\d{1,2}\.(?:19|20)\d{2}(?![\w.]*\d)'
  - name: SITE_ID
    tier: REGEX
    confidence_threshold: 0.85
    reversible: true
    patterns:
      - '(?<![\w-])[A-Z]{2,5}(?:-[A-Z0-9]{2,10})*-\d{2,6}(?![\w-])'
  - name: ACCOUNT_NUMBER_DE
    tier: REGEX
    confidence_threshold: 0.85
    reversible: true
    patterns:
      - '(?:(?<=Kundenkonto )|(?<=Kundennummer )|(?<=Kontonummer )|(?<=Konto )|(?<=Vertragsnummer )|(?<=Zählernummer ))\d[\d-]{3,22}\d(?![\w-])'
  - name: STREET_ADDRESS_DE
    tier: REGEX
    confidence_threshold: 0.8
    reversible: true
    patterns:
      - '(?<![\w-])[A-ZÄÖÜ][a-zäöüß]+(?:-[A-ZÄÖÜ]?[a-zäöüß]+)*(?:straße|strasse|str\.|weg|allee|platz|gasse|ring|damm|ufer|chaussee|steig|pfad)\s+\d{1,4}(?:\s?[a-zA-Z])?(?:\s?-\s?\d{1,4})?(?![\w-])'
  - name: POSTCODE_CITY_DE
    tier: REGEX
    confidence_threshold: 0.8
    reversible: true
    patterns:
      - '(?<![\w-])\d{5}\s+(?!(?:Mitarbeiter|Euro|EUR|Stück|Kunden|Menschen|Einwohner|Nutzer|Fälle|Tonnen|Meter|Kilometer|Jahre|Tage)\b)[A-ZÄÖÜ][a-zäöüß]+(?:[\s-](?:am|an der|im|ob der|[A-ZÄÖÜ][a-zäöüß]+))?(?:\s[A-ZÄÖÜ][a-zäöüß]+)?(?=[\s,.;:)!?"]|$)'
  # Common German first names (optional capitalised surname). Covers the
  # cases where the German NER model misses a single first name such as
  # "für Anna prüfen"; boundaries stop at the next lowercase word.
  - name: PERSON_NAME_DE
    tier: REGEX
    confidence_threshold: 0.7
    reversible: true
    patterns:
      - '(?<![\w-])(?:Anna|Maria|Sophie|Sofia|Emma|Mia|Hannah|Lea|Leonie|Laura|Lena|Julia|Sarah|Lisa|Katharina|Johanna|Clara|Marie|Paula|Charlotte|Ursula|Monika|Petra|Sabine|Claudia|Andrea|Susanne|Stefanie|Nicole|Christina|Jonas|Lukas|Leon|Finn|Paul|Felix|Max|Maximilian|Ben|Elias|Noah|Luca|Tim|Jan|Niklas|Hans|Peter|Klaus|Michael|Thomas|Andreas|Stefan|Christian|Markus|Matthias|Alexander|Daniel|Sebastian|Tobias|Florian|Wolfgang|Jürgen|Uwe|Frank|Dieter)(?:\s+[A-ZÄÖÜ][a-zäöüß]+(?:-[A-ZÄÖÜ][a-zäöüß]+)?)?(?![\w-])'
  - name: PERSON
    tier: NER
    confidence_threshold: 0.7
    reversible: true
    presidio_entities: ["PERSON"]
  - name: LOCATION
    tier: NER
    confidence_threshold: 0.7
    reversible: true
    presidio_entities: ["LOCATION", "GPE"]
checksum:
  algorithm: iso7064_mod11_2
  validator_id: TAX_ID_DE
checksums:
  - algorithm: iso7064_mod11_2
    validator_id: TAX_ID_DE
  - algorithm: icao9303
    validator_id: PERSONAL_AUSWEIS
  - algorithm: kvnr
    validator_id: KVNR
  - algorithm: iban_mod97
    validator_id: IBAN_DE
