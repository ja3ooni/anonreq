# NLP engine config for the AnonReq demo Presidio image.
# Both models are pinned in docker/presidio/Dockerfile:
#   en_core_web_lg==3.7.1 and de_core_news_lg==3.7.0
# They load at process start. Do not drop the English model; en requests
# still need it. This file replaces conf/default.yaml in the image.
nlp_engine_name: spacy
models:
  -
    lang_code: en
    model_name: en_core_web_lg
  -
    lang_code: de
    model_name: de_core_news_lg

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    NORP: NRP
    FAC: LOCATION
    LOC: LOCATION
    GPE: LOCATION
    LOCATION: LOCATION
    ORG: ORGANIZATION
    ORGANIZATION: ORGANIZATION
    DATE: DATE_TIME
    TIME: DATE_TIME

  low_confidence_score_multiplier: 0.4
  low_score_entity_names:
    -
  labels_to_ignore:
    - ORGANIZATION
    - CARDINAL
    - EVENT
    - LANGUAGE
    - LAW
    - MONEY
    - ORDINAL
    - PERCENT
    - PRODUCT
    - QUANTITY
    - WORK_OF_ART
