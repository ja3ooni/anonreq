# German address patterns for language=de.
# Each pattern is its own recognizer entry. Presidio's YAML loader registers
# every item under "recognizers"; keeping street and postal code as separate
# entries means a loader that walks the list does not drop the second pattern.
# Scores sit above the gateway's 0.7 threshold.
#
# Presidio 2.2.354 PatternRecognizer compiles with IGNORECASE.
recognizers:
  - name: German Street Line
    supported_language: de
    supported_entity: LOCATION
    patterns:
      - name: de_street_line
        regex: '\b[A-ZÄÖÜ][\wÄÖÜäöüß.\-]*?(?:straße|strasse|str\.|weg|platz|allee|ring|gasse|damm|ufer)\s+\d{1,4}[a-z]?\b'
        score: 0.85
  - name: German Postal City
    supported_language: de
    supported_entity: LOCATION
    patterns:
      - name: de_postal_city
        regex: '\b\d{5}\s+[A-ZÄÖÜ][a-zäöüß]+(?:[- ][A-ZÄÖÜa-zäöüß]+)*\b'
        score: 0.85
