# Real-stack test environment used by Corral's gateway integration tests.
#   gateway + Presidio + Valkey (no persistence) + PostgreSQL + a stub LLM provider.
# Not for production. Host ports are bound to 127.0.0.1 and differ from docker-compose.yml
# so both can run side by side.
#
#   docker compose -f docker-compose.corral-test.yml up -d --wait
#   docker compose -f docker-compose.corral-test.yml --profile replicas up -d --wait   # second gateway

name: corral-test

x-gateway-env: &gateway-env
  ANONREQ_API_KEY: corral-test-chat-key-0123456789abcdef0123456789
  ANONREQ_ADMIN_API_KEY: corral-test-admin-key-0123456789abcdef012345
  ANONREQ_VALKEY_URL: redis://valkey:6379/0
  ANONREQ_PRESIDIO_URL: http://presidio-analyzer:3000
  ANONREQ_DATABASE_URL: postgresql+asyncpg://anonreq:anonreq@postgres:5432/anonreq
  ANONREQ_SINGLE_TENANT: "false"
  # Shipped default is PASS (forward unmatched requests untouched). Corral requires ANONYMIZE.
  ANONREQ_CLASSIFICATION_DEFAULT_ACTION: ANONYMIZE
  ANONREQ_REQUIRE_ANONYMIZATION: "true"   # refuse to boot if the above is ever removed
  ANONREQ_PROXY_MODE: full   # explicit: the Settings default says proxy-only (no detection)
  ANONREQ_TENANT_CACHE_TTL_SECONDS: "2"
  ANONREQ_TENANT_NEGATIVE_CACHE_TTL_SECONDS: "1"
  PROVIDER_API_KEY: stub-provider-key
  PROVIDER_BASE_URL: http://stub-provider:8081
  ANONREQ_OPENAI_API_KEY: stub-provider-key
  ANONREQ_LOG_LEVEL: INFO

services:
  valkey:
    image: valkey/valkey:8.0
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  presidio-analyzer:
    image: ${PRESIDIO_IMAGE:-mcr.microsoft.com/presidio-analyzer:2.2.354}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anonreq
      POSTGRES_PASSWORD: anonreq
      POSTGRES_DB: anonreq
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonreq -d anonreq"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: anonreq-gateway:corral-test
    command: ["alembic", "upgrade", "head"]
    environment: *gateway-env
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}

  gateway:
    image: anonreq-gateway:corral-test
    environment: *gateway-env
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      presidio-analyzer: {condition: service_healthy}
      valkey: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; r = urllib.request.Request('http://localhost:8080/health', headers={'Authorization': 'Bearer ' + os.environ['ANONREQ_API_KEY']}); urllib.request.urlopen(r, timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway-b:
    profiles: ["replicas"]
    image: anonreq-gateway:corral-test
    environment: *gateway-env
    ports: ["127.0.0.1:18082:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      presidio-analyzer: {condition: service_healthy}
      valkey: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; r = urllib.request.Request('http://localhost:8080/health', headers={'Authorization': 'Bearer ' + os.environ['ANONREQ_API_KEY']}); urllib.request.urlopen(r, timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  stub-provider:
    image: anonreq-gateway:corral-test
    working_dir: /stub
    healthcheck:
      disable: true
    command: ["uvicorn", "stub_provider:app", "--host", "0.0.0.0", "--port", "8081"]
    volumes:
      - ./tests/corral/stub_provider.py:/stub/stub_provider.py:ro
    ports: ["127.0.0.1:18081:8081"]
